<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Upload Page</title>
    <link rel="stylesheet" href="photos.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>
    <header>
        <div class="header-container">
            <!-- Logo and Title -->
            <div class="header-left">
                <img src="images/uforians.png" alt="Uforians Logo" class="logo">
                <!--h1 class="site-title">Friends & Family Events</h1-->
            </div>

            <!-- Navigation Links -->
            <div class="nav-links">
                <a href="index.html" class="home-link">🏠 Home</a> |
                <a href="calendar.html" class="calendar-link">📅 View Calendar</a> |
                <a href="month.html" class="calendar-link">📆 Monthly View</a> |
            </div>

            <!-- User Info & Logout -->
            <div class="header-right">
                <span id="user-name"></span>
                <button id="logout-btn">Logout</button>
            </div>
        </div>
    </header>


    <div class="upload-area" id="uploadArea">Drag & Drop photos here or Click to Upload</div>
    <div class="album" id="album"></div>

    <script src="config.js"></script>
    <script src="photos.js"></script>

</body>

</html>
