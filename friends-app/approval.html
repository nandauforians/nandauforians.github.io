<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Approval | Uforians</title>
    <script src="config.js" defer></script>
    <link rel="stylesheet" href="approval.css">
</head>
<body>
    <div id="approval-container">
        <img src="images/uforians.png" alt="Uforians Logo" class="logo">
        <h2>Pending Approvals</h2>
        <table id="approval-table">
            <thead>
                <tr>
                    <th>Email</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="approval-list">
                <tr>
                    <td>example@email.com</td>
                    <td><button class="approve-btn">Approve</button></td>
                </tr>
            </tbody>
        </table>
        <button id="refresh-btn">Refresh List</button>
    </div>
    <script src="approval.js"></script>
</body>
</html>
